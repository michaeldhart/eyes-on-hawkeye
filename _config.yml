title: Eyes on Hawkeye
tagline: Watching the data center deal in our town, in the open.
description: A community-run archive of the public records behind our town's proposed data center.
url: "https://eyesonhawkeye.com"
baseurl: ""

contact_form_url: https://docs.google.com/forms/d/e/1FAIpQLSe2vlTj41j0sDUg6e8GYaK8-Ye-CXdBKYFu3u3HbZEwE9Lffg/viewform

# GoatCounter: the site code only, not the full URL. _layouts/default.html builds
# https://<code>.goatcounter.com/count from it. Cookieless and with no personal
# data, so it needs no consent banner. It only loads in the production build
# (the Pages workflow), so local previews never record a hit. What it collects is
# disclosed on /about/, which is also gated on this key.
goatcounter_code: eyesonhawkeye

# The home page overview ("What the Records Show So Far") is rewritten by hand.
# overview_through = the newest record it covers; overview_reviewed = when it was last
# checked against the records. scripts/check_people.py warns if a record is newer than
# overview_through. Update both whenever the overview text changes.
overview_through: 2026-07-27
overview_reviewed: 2026-10-14

author:
  name: Michael Hart
  url: https://michaeldhart.com

markdown: kramdown
permalink: pretty
excerpt_separator: ""
exclude: [README.md, CLAUDE.md, Gemfile, Gemfile.lock, scripts, vendor, node_modules]

collections:
  documents:
    output: true
    permalink: /documents/:name/
  entries:
    output: false   # timeline-only items; documents appear on the timeline automatically
  people:
    output: true    # one page per person or organization; see scripts/check_people.py
    permalink: /people/:name/

defaults:
  - scope: { path: "", type: documents }
    values: { layout: document }
  - scope: { path: "", type: people }
    values: { layout: person }
  - scope: { path: "" }
    values: { layout: page }
