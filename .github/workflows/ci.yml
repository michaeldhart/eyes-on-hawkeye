name: CI
# Runs the same checks as the deploy workflow on every pull request, without deploying.
# The job name `checks` is what the branch ruleset on `main` requires.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.4", bundler-cache: true }
      - name: Check the people and organizations registry
        run: python3 scripts/check_people.py
      - name: Check the Spanish translations
        run: python3 scripts/check_i18n.py
      - name: Check the PDFs (every sha256 matches its file)
        run: python3 scripts/check_pdfs.py
      - name: Build the site (fail on errors and warnings)
        # `shell: bash` makes GitHub run bash with -e and pipefail, so a failing
        # `jekyll build` fails the step even though `tee` succeeds. The log lives
        # in $RUNNER_TEMP so Jekyll never copies it into _site.
        shell: bash
        env: { JEKYLL_ENV: production }
        run: |
          set -euo pipefail
          bundle exec jekyll build --baseurl "" 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -qi 'warning' "$RUNNER_TEMP/build.log"; then
            echo "::error::The Jekyll build produced warnings"
            exit 1
          fi
      - name: Smoke-test the built site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4000 --directory _site --bind 127.0.0.1 > /dev/null 2>&1 &
          python3 scripts/smoke_test.py --base-url http://127.0.0.1:4000 --retries 5 --retry-wait 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/a11y/package-lock.json
      - name: Install the accessibility checker
        working-directory: scripts/a11y
        run: npm ci --no-audit --no-fund
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/a11y/package-lock.json') }}
      - name: Install the browser
        working-directory: scripts/a11y
        run: npx playwright install --with-deps chromium
      - name: Accessibility check (axe-core, zero violations)
        working-directory: scripts/a11y
        shell: bash
        run: |
          set -euo pipefail
          node check-a11y.mjs --self-test
          python3 -m http.server 4001 --directory ../../_site --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 1
          node check-a11y.mjs --base-url http://127.0.0.1:4001
